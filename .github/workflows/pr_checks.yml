# .github/workflows/pr_checks.yml
#
# Runs on every push/PR to main.
# Checks for syntax errors and critical issues only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8 --quiet

      - name: Check for syntax errors
        run: |
          flake8 core/ pipeline/ api/ scripts/ \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
